<head>

<meta name="robots" content="noindex">

</head>
<body>
<header class="site">
  <div class="site-inner">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">A</span>Ashrut Arora</a>
    <nav aria-label="Site">
      <a href="/interview-experiences/">Interviews</a>
      <a class="ext" href="https://www.linkedin.com/in/ashrutarora/">LinkedIn</a>
      <a class="ext" href="https://github.com/ashrutarora">GitHub</a>
      <button class="theme" type="button" aria-label="Switch between light and dark mode">
        <span class="theme-label light-label">Light</span><span class="theme-label dark-label">Dark</span>
        <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.5 5.5 0 0 1 6.4 2.5a5.5 5.5 0 1 0 7.1 7.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
<main id="main">
<section class="hero">
  <h1>Page not found</h1>
  <p>There’s nothing at this address. Try the home page instead.</p>
  <div class="links"><a href="/"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to home</a></div>
</section>
</main>
<script>
(() => {
  const root = document.documentElement;
  document.querySelector('.theme')?.addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  });
  const site = document.querySelector('.site');
  const onScroll = () => site.classList.toggle('scrolled', scrollY > 8);
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
